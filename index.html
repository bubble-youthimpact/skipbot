const FEATURED = ["유튜브","넷플릭스","쿠팡","아마존","카카오","네이버","삼성전자","배달의민족","애플","토스"];

function telHref(contact) {
  const match = contact.match(/(?:\+\d|\d)[\d\s-]{1,}\d/);
  if (!match) return null;
  const raw = match[0].trim();
  const digits = raw.replace(/\D/g, "");
  if (digits.length < 3) return null;
  if (raw.startsWith("+")) return "tel:+" + digits;
  if (/^1[\s-]/.test(raw) && digits.length === 11) return "tel:+" + digits;
  if (/영국/.test(contact) && digits.startsWith("0")) return "tel:+44" + digits.slice(1);
  return "tel:" + digits;
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, desc, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.innerHTML = esc(msg) + (desc ? "<small>" + esc(desc) + "</small>" : "");
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

const featured = FEATURED.map((ko) => COMPANIES.find((c) => c.ko === ko)).filter(Boolean);
$("total").textContent = COMPANIES.length;

function render() {
  const q = $("q").value.trim().toLowerCase();
  const results = q ? COMPANIES.filter((c) =>
    c.ko.toLowerCase().includes(q) || c.en.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)) : null;
  const list = results || featured;
  $("listLabel").textContent = results ? "검색 결과 " + results.length + "곳" : "인기 TOP 10";
  if (!list.length) {
    $("list").innerHTML = '<li class="empty">검색 결과가 없어요. 오른쪽 위 제보 버튼으로 알려주세요.</li>';
    return;
  }
  $("list").innerHTML = list.map((c) => {
    const i = COMPANIES.indexOf(c);
    const href = telHref(c.contact);
    const label = esc(c.ko) + "에 전화하기";
    const btn = href
      ? '<a class="call press" href="' + href + '" target="_top" rel="noopener" data-i="' + i + '" aria-label="' + label + '" title="' + label + '"><svg class="i"><use href="#phone"/></svg></a>'
      : '<button type="button" class="call press" data-none="1" aria-label="' + label + '" title="' + label + '"><svg class="i"><use href="#phone"/></svg></button>';
    return '<li class="item"><div class="info">' +
      '<p class="name">' + esc(c.ko) + '<span class="cat">' + esc(c.category) + '</span></p>' +
      '<p class="num">' + (href ? esc(c.contact) : "전화번호 없음") + '</p>' +
      '<p class="tip">팁: <b>' + esc(c.tip) + '</b></p>' +
      '</div>' + btn + '</li>';
  }).join("");
}

$("q").addEventListener("input", render);
$("list").addEventListener("click", (e) => {
  const el = e.target.closest(".call");
  if (!el) return;
  if (el.dataset.none) { toast("등록된 전화번호가 없어 전화를 걸 수 없어요.", "", true); return; }
  const c = COMPANIES[+el.dataset.i];
  setTimeout(() => {
    $("callingTitle").textContent = c.ko + " 전화 거는 중 · " + c.contact;
    $("callingTip").textContent = c.tip;
    $("calling").hidden = false;
  }, 400);
});
$("closeCalling").onclick = () => { $("calling").hidden = true; };

$("openReport").onclick = () => { $("report").hidden = false; $("rName").focus(); };
$("closeReport").onclick = () => { $("report").hidden = true; };
$("reportForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const company_name = $("rName").value.trim();
  const contact_info = $("rInfo").value.trim();
  const btn = $("rSubmit");
  if (!company_name || !contact_info || btn.disabled) return;
  btn.disabled = true; btn.textContent = "저장 중...";
  try {
    if (!SUPABASE_URL || !SUPABASE_KEY) throw new Error("not configured");
    const res = await fetch(SUPABASE_URL + "/rest/v1/contact_reports", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ company_name, contact_info }),
    });
    if (!res.ok) throw new Error(res.status);
    toast("제보가 저장됐어요!", "확인 후 목록에 반영할게요.");
    $("rName").value = ""; $("rInfo").value = "";
    $("report").hidden = true;
  } catch {
    toast("제보를 저장하지 못했어요. 잠시 후 다시 시도해 주세요.", "", true);
  } finally {
    btn.disabled = false; btn.textContent = "제보 보내기";
  }
});

render();
